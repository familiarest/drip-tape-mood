    <text x="264" y="105" text-anchor="middle">SIDE 26</text>
    <text x="280.5" y="105" text-anchor="middle" transform="rotate(90 280.5 105)">GLUE 7</text>
    <line x1="13" y1="204" x2="23" y2="204" stroke="#000" stroke-width="0.35" />
    <text x="25" y="205">CUT</text>
    <line x1="45" y1="204" x2="55" y2="204" stroke="#e1261c" stroke-width="0.28" stroke-dasharray="4 2" />
    <text x="57" y="205">FOLD</text>
    <text x="284" y="205" text-anchor="end">A4 landscape • 100% • finished 106 × 132 × 26 mm</text>
